<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ONE-LINE RPG</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#10131e;color:#eef4ff;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}canvas{display:block;width:100%;height:100%}.hud,.panel{position:fixed;background:rgba(12,16,29,.86);border:1px solid #3d4d76;border-radius:12px;box-shadow:0 12px 36px #0009;backdrop-filter:blur(10px);z-index:2}.hud{top:14px;left:14px;right:14px;padding:12px 16px;display:flex;gap:22px;align-items:center}.title{color:#83e7ff;letter-spacing:.14em}.metric{display:grid;gap:3px;color:#91a5c6}.metric b{color:#ffe39a;font-size:14px}.panel{right:14px;top:86px;width:252px;padding:14px;line-height:1.6}.row{display:flex;justify-content:space-between;color:#91a5c6}.row b{color:#ecf5ff}.telegraph{margin-top:12px;padding:8px;border:1px solid #ee6d8466;border-radius:8px;color:#ff9daa;background:#7e26351c}.agent{margin-top:12px;padding-top:10px;border-top:1px solid #3d4d76}.agent strong{display:block;color:#a7ffcf;font-size:15px}.hint{color:#7890b5;font-size:10px}.legend{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);color:#8fa4c7;background:#0c1020d9;padding:8px 14px;border-radius:8px;border:1px solid #334267;z-index:2}.legend kbd{color:#ffe39a}.work{display:none;left:50%;right:auto;top:auto;bottom:65px;transform:translateX(-50%);width:min(620px,92vw)}.work.open{display:block}.work button{margin:4px;padding:9px 14px;background:#17233d;border:1px solid #5773a8;color:#eaf3ff;border-radius:7px;font:inherit;cursor:pointer}.work button:hover{border-color:#83e7ff;color:#83e7ff}@media(max-width:720px){.hud{gap:8px;padding:8px;font-size:10px}.hud .optional{display:none}.panel{top:96px;width:205px}.legend{font-size:10px;white-space:nowrap}}
</style></head><body><canvas id="game"></canvas><header class="hud"><strong class="title">ONE-LINE RPG</strong><div class="metric"><small>WAVE</small><b id="wave">1</b></div><div class="metric"><small>DISTANCE</small><b id="distance">0m</b></div><div class="metric"><small>LEVEL</small><b id="level">1</b></div><div class="metric optional"><small>COMBO</small><b id="combo">0</b></div><div class="metric"><small>HP</small><b id="hp">100</b></div><div class="metric"><small>SP</small><b id="sp">100</b></div></header><aside class="panel"><div class="row"><span>CLASS</span><b id="class">WARRIOR</b></div><div class="row"><span>ACTION</span><b id="action">観測中</b></div><div class="row"><span>REWARD</span><b id="reward">+0.00</b></div><div class="row"><span>EPSILON</span><b id="epsilon">20%</b></div><div class="row"><span>STATES</span><b id="states">0</b></div><div class="telegraph"><small>ENEMY TELEGRAPH</small><strong id="telegraph">NONE</strong><div class="hint" id="telegraph-detail">間合いを観測中</div></div><div class="agent"><small>RL POLICY</small><strong id="policy">OBSERVE</strong><div class="hint">人間のキー入力は任意の上書き</div></div><div id="status" class="hint">自動再出撃 · LINE BATTLE</div></aside><div class="legend"><kbd>JUMP</kbd>=近接(Rat/Crab)を回避　<kbd>GUARD</kbd>=弾(Skull)を防御・要スタミナ　┃　学習は自動保存(リロード継続)　<kbd>P</kbd>停止　<kbd>R</kbd>学習リセット</div><script type="module" src="/one_line_rpg.js"></script></body></html>
