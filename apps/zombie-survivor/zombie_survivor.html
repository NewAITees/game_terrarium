<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZOMBIE SURVIVOR</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#101614;color:#eaffef;font:12px monospace}canvas{width:100%;height:100%;display:block}.hud{position:fixed;top:12px;left:12px;right:12px;padding:12px;background:#08110ddd;border:1px solid #345448;border-radius:10px;display:flex;gap:18px;z-index:2}.hud b{color:#ffd166}.panel{position:fixed;right:12px;top:75px;width:235px;padding:12px;background:#08110ddd;border:1px solid #345448;border-radius:10px;z-index:2}.panel div{margin:6px 0}.panel b{color:#6dff9d}.work{display:none;left:50%;right:auto;top:auto;bottom:18px;transform:translateX(-50%);width:min(650px,90vw)}.work.open{display:block}.work button{margin:4px;padding:9px;background:#14271f;border:1px solid #527a62;color:#eaffef;border-radius:6px;cursor:pointer}.work button:hover{border-color:#ffd166;color:#ffd166}</style></head><body><canvas id="game"></canvas><header class="hud"><b>ZOMBIE SURVIVOR</b><span>WAVE <b id="wave">1</b></span><span>TIME <b id="time">35</b></span><span>LV <b id="level">1</b></span><span>KILLS <b id="kills">0</b></span><span>FOOD <b id="food">30</b></span><span>FUEL <b id="fuel">30</b></span><span>SCRAP <b id="scrap">0</b></span></header><aside class="panel"><div>HP <b id="hp">100/100</b></div><div>STAMINA <b id="stamina">100/100</b></div><div>XP <b id="xp">0/10</b></div><div>WEAPON <b id="weapon">HANDGUN</b></div><div>AMMO <b id="ammo">36/60</b></div><div>MODE <b id="action">観測中</b></div><div>ACTION <b id="button">OBSERVE</b></div><div>BOOST <b id="boost">READY</b></div><div>EDGE <b id="edge">SAFE</b></div><div id="status">WAVE進行中</div><div>DEATH REASON <b id="death">-</b></div><small>移動: WASD / 矢印　武器: Q/E　ブースト: Shift　停止: Space</small></aside><section id="work" class="panel work"><b>休憩タイム：RLが自動育成（人間の介入は任意）</b><br><button data-work="food">食料を確保</button><button data-work="fuel">燃料を確保</button><button data-work="repair">修理</button><button data-work="upgrade">選択武器をスクラップ強化</button><button data-work="ammo">弾薬工作</button></section><script type="module" src="/zombie_survivor.js"></script></body></html>
