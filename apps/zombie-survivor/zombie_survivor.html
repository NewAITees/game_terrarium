<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZOMBIE SURVIVOR</title>
<style>
:root{color-scheme:dark;--red:#ff526e;--green:#6dff9d;--amber:#ffd166}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b0c;color:#e7f4ec;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}canvas{display:block;width:100%;height:100%}.panel{position:fixed;background:rgba(8,14,15,.8);border:1px solid #29413a;border-radius:10px;padding:12px;box-shadow:0 8px 30px #0008}.top{top:14px;left:14px;right:14px;display:flex;gap:24px;align-items:center}.title{color:var(--red);letter-spacing:.12em}.metric{display:grid;gap:3px}.metric small{color:#779087;font-size:9px}.metric b{font-size:14px}.side{top:82px;right:14px;width:230px;display:grid;gap:9px}.row{display:flex;justify-content:space-between;color:#86a097;font-size:10px}.row b{color:#effff4}.bar{height:6px;background:#1a2c27;border-radius:4px;overflow:hidden}.fill{height:100%;background:var(--green);width:100%}.agent{border-top:1px solid #29413a;padding-top:9px}.agent b{display:block;color:var(--amber);margin-top:5px;font-size:16px}.work{left:50%;bottom:22px;transform:translateX(-50%);display:none;width:min(700px,calc(100vw - 30px))}.work.open{display:block}.work h3{margin:0 0 10px;color:var(--amber);font-size:13px}.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.buttons button{border:1px solid #3b5f51;border-radius:7px;padding:10px 6px;background:#12211c;color:#dfffea;font:inherit;font-size:10px;cursor:pointer}.buttons button:hover{border-color:var(--amber);color:var(--amber)}.hint{color:#749087;font-size:9px;margin-top:8px}@media(max-width:700px){.top{gap:10px;flex-wrap:wrap}.side{top:115px;width:190px}.optional{display:none}.buttons{grid-template-columns:repeat(2,1fr)}}
</style></head><body><canvas id="game"></canvas><header class="panel top"><strong class="title">ZOMBIE SURVIVOR</strong><div class="metric"><small>WAVE</small><b id="wave">1</b></div><div class="metric"><small>LEVEL</small><b id="level">1</b></div><div class="metric optional"><small>KILLS</small><b id="kills">0</b></div><div class="metric"><small>FOOD</small><b id="food">30</b></div><div class="metric"><small>FUEL</small><b id="fuel">30</b></div><div class="metric optional"><small>SCRAP</small><b id="scrap">0</b></div></header><aside class="panel side"><div class="row"><span>HULL</span><b id="hp">100 / 100</b></div><div class="bar"><div id="hp-fill" class="fill"></div></div><div class="row"><span>XP</span><b id="xp">0 / 10</b></div><div class="bar"><div id="xp-fill" class="fill" style="background:#ffd166;width:0%"></div></div><div class="agent"><small>Q-LEARNING AGENT</small><b id="action">観測中</b><div class="row"><span>探索率 ε</span><b id="epsilon">20%</b></div><div class="row"><span>方策</span><b id="policy">戦闘</b></div></div><div id="status" class="hint">WAVE進行中 · 自律戦闘</div></aside><section id="work" class="panel work"><h3>作業タイム — エージェントの方策を上書きできます</h3><div class="buttons"><button data-work="food">食料を確保<br>燃料 -2</button><button data-work="fuel">燃料を確保<br>食料 -2</button><button data-work="repair">拠点を修理<br>スクラップ -6</button><button data-work="upgrade">武器を強化<br>スクラップ -10</button></div><div class="hint">未選択ならエージェントが資源収支を見て自動選択します。</div></section><script type="module" src="/apps/zombie-survivor/zombie_survivor.ts"></script></body></html>
